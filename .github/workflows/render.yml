name: Render animation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core python3-pil

      - name: Render frames
        run: python3 render.py

      - name: Build narration and mix audio
        run: |
          ffmpeg -y -v error -i tts/line1.mp3 -i tts/line2.mp3 -i tts/line3.mp3 \
            -filter_complex "[0]adelay=1000:all=1[l1];[1]adelay=11000:all=1[l2];[2]adelay=21000:all=1[l3];[l1][l2][l3]amix=inputs=3:duration=longest:normalize=0,apad,atrim=0:30[n]" \
            -map "[n]" narration.wav
          ffmpeg -y -v error -i narration.wav -i music.mp3 \
            -filter_complex "[0][1]amix=inputs=2:duration=first:normalize=0,afade=t=out:st=27:d=3[a]" \
            -map "[a]" final_audio.wav

      - name: Encode video
        run: |
          ffmpeg -y -v error -framerate 24 -i frames/frame_%04d.png -i final_audio.wav \
            -c:v libx264 -pix_fmt yuv420p -r 24 -c:a aac -b:a 160k -shortest penjara-test-full.mp4
          ffmpeg -y -v error -i penjara-test-full.mp4 -vf scale=540:960 \
            -c:v libx264 -crf 28 -pix_fmt yuv420p -c:a aac -b:a 128k penjara-test-whatsapp.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: penjara-test-video
          path: |
            penjara-test-full.mp4
            penjara-test-whatsapp.mp4
